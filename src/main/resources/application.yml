spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: tutorkim-backend
  datasource:
    url: ${TUTORKIM_DB_URL:jdbc:postgresql://localhost:5432/tutorkim}
    username: ${TUTORKIM_DB_USERNAME:tutorkim}
    password: ${TUTORKIM_DB_PASSWORD:}
  data:
    redis:
      host: ${TUTORKIM_REDIS_HOST:localhost}
      port: ${TUTORKIM_REDIS_PORT:6379}
      password: ${TUTORKIM_REDIS_PASSWORD:}
  jpa:
    defer-datasource-initialization: false
    hibernate:
      ddl-auto: ${TUTORKIM_JPA_DDL_AUTO:validate}
    open-in-view: false
  sql:
    init:
      mode: ${TUTORKIM_SQL_INIT_MODE:always}
      separator: ";;"

server:
  port: ${TUTORKIM_SERVER_PORT:8080}

management:
  endpoints:
    web:
      exposure:
        include: health,info

tutorkim:
  app:
    base-url: ${TUTORKIM_APP_BASE_URL:http://localhost:8080}
    frontend-base-url: ${TUTORKIM_FRONTEND_BASE_URL:http://localhost:5173}
  kakao:
    client-id: ${TUTORKIM_KAKAO_CLIENT_ID:}
    client-secret: ${TUTORKIM_KAKAO_CLIENT_SECRET:}
    redirect-uri: ${TUTORKIM_KAKAO_REDIRECT_URI:${tutorkim.app.base-url}/api/v1/auth/kakao/callback}
